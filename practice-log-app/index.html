<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Practice log</title>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Claudia's journey</div>
    <h1>practice log</h1>
    <p>Daily reps, one streak at a time.</p>
    <div class="flourish" aria-hidden="true">
      <svg viewBox="0 0 60 14"><path d="M0 7 Q15 0, 30 7 T60 7" fill="none" stroke="#E8799F" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="stat-current">–</div><div class="label">Current streak</div></div>
    <div class="stat"><div class="num" id="stat-longest">–</div><div class="label">Longest streak</div></div>
    <div class="stat"><div class="num" id="stat-total">–</div><div class="label">Total days</div></div>
  </div>

  <div class="card">
    <h2>habit tracker</h2>
    <div class="sub">Tap a square to check off the day. Streak stats above track "Coding challenge".</div>
    <div class="cal-nav">
      <button id="prev-month" aria-label="Previous month">&larr;</button>
      <div class="month-label" id="month-label">–</div>
      <button id="next-month" aria-label="Next month">&rarr;</button>
    </div>
    <div class="habit-grid-wrap">
      <table class="habit-table" id="habit-table"></table>
    </div>
    <div class="add-habit-row">
      <input type="text" id="new-habit-input" placeholder="Add a habit (e.g. Reading)">
      <button id="add-habit-btn">Add</button>
    </div>
  </div>

  <div class="card">
    <h2>phase 1&ndash;2 — foundations</h2>
    <div class="sub" id="phase-progress-label">Loading progress…</div>
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="progress-bar" style="width:0%"></div></div>
    <div class="checklist" id="checklist"></div>
  </div>

  <div class="reset-link"><button id="reset-btn">Reset all data</button></div>
  <div class="footnote">Saved automatically on this computer ♡</div>

</div>

<script src="./js/scripts.js"></script>
</body>
</html>
